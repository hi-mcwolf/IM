<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>来源管理 · Digiplus</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/im.css">
</head>
<body>
  <div class="app-layout">
    <aside id="sidebar"></aside>
    <div class="app-content">
      <header id="topbar"></header>
      <div class="content-body">
        <main class="page-main" id="content"></main>
      </div>
    </div>
  </div>
  <div class="drawer-root" id="sceneDrawer">
    <div class="drawer-mask" data-close></div>
    <aside class="drawer drawer-md">
      <header class="drawer-header">
        <h3 id="sceneDrawerTitle">来源编辑</h3>
        <button class="icon-btn" type="button" data-close aria-label="关闭"><i data-lucide="x"></i></button>
      </header>
      <div class="drawer-body" id="sceneDrawerBody"></div>
      <footer class="drawer-footer">
        <button class="btn btn-outline" type="button" id="sceneCancelBtn">取消</button>
        <button class="btn btn-primary" type="button" id="sceneSaveBtn">保存</button>
      </footer>
    </aside>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/mock-data.js"></script>
  <script src="assets/scenes.js"></script>
</body>
</html>
