<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>令牌集成 · Digiplus</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/im.css">
</head>
<body>
  <div class="app-layout">
    <aside id="sidebar"></aside>
    <div class="app-content">
      <header id="topbar"></header>
      <div class="content-body">
        <main class="page-main" id="content"></main>
      </div>
    </div>
  </div>
  <div class="drawer-root" id="al-drawer">
    <div class="drawer-mask" onclick="onDrawerMaskClick()"></div>
    <aside class="drawer drawer-md" role="dialog" aria-modal="true">
      <header class="drawer-header">
        <h3 id="al-drawer-title">自动登录配置</h3>
        <button class="icon-btn" type="button" aria-label="关闭" onclick="closeAutoLoginModal()"><i data-lucide="x"></i></button>
      </header>
      <div class="drawer-body" id="al-drawer-body"></div>
      <footer class="drawer-footer">
        <button class="btn btn-outline" type="button" onclick="closeAutoLoginModal()">关闭</button>
      </footer>
    </aside>
  </div>
  <div class="drawer-root" id="be-drawer">
    <div class="drawer-mask" onclick="closeBotEdit()"></div>
    <aside class="drawer drawer-md" role="dialog" aria-modal="true">
      <header class="drawer-header">
        <h3 id="be-drawer-title">编辑 Bot</h3>
        <button class="icon-btn" type="button" aria-label="关闭" onclick="closeBotEdit()"><i data-lucide="x"></i></button>
      </header>
      <div class="drawer-body" id="be-drawer-body"></div>
      <footer class="drawer-footer">
        <button class="btn btn-outline" type="button" onclick="closeBotEdit()">取消</button>
        <button class="btn btn-primary" type="button" id="be-save" onclick="saveBotEdit()">保存</button>
      </footer>
    </aside>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/mock-data.js"></script>
  <script src="assets/bots.js"></script>
</body>
</html>
