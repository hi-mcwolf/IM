<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>社交聊天机器人 · 自动登录配置</title>
  <style>
:root {
  --bg: #F5F6F8;
  --card: #FFFFFF;
  --primary: #2E6BE6;
  --primary-weak: #EEF4FF;
  --primary-border: #C9DBFF;
  --line: #E5E7EB;
  --text-1: #1F2329;
  --text-2: #4E5969;
  --text-3: #86909C;
  --danger: #E5484D;
  --success: #2BA471;
  --warning: #FF7D00;
  --radius-s: 4px;
  --radius-m: 6px;
  --radius-l: 8px;
  --font: "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-width: 1280px;
  height: 100%;
  font-family: var(--font);
  font-size: 14px;
  color: var(--text-1);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

button { font-family: var(--font); }
a { text-decoration: none; color: inherit; }
[hidden] { display: none !important; }

.lucide { width: 16px; height: 16px; stroke-width: 1.8; flex: none; }
.req { color: var(--danger); margin-left: 2px; }

/* ---------------- 布局 ---------------- */
.app-layout { display: flex; height: 100vh; overflow: hidden; }
.app-content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.content-body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; }

/* ---------------- 顶栏 ---------------- */
.topbar {
  height: 56px;
  flex: none;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px 0 0;
}
.topbar-menu { display: flex; align-items: center; height: 100%; }
.topbar-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 100%;
  padding: 0 24px;
  font-size: 14px;
  color: var(--text-2);
  cursor: pointer;
}
.topbar-item:hover { color: var(--text-1); }
.topbar-item.active { color: var(--primary); font-weight: 600; }
.topbar-item.active::after {
  content: "";
  position: absolute;
  left: 24px;
  right: 24px;
  bottom: 0;
  height: 2px;
  background: var(--primary);
}
.topbar-user {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-2);
}
.topbar-user .avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--primary-weak);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
}

/* ---------------- 侧边栏 ---------------- */
.sidebar {
  width: 220px;
  flex: none;
  background: var(--card);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
}
.sb-brand {
  height: 56px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 20px;
  font-size: 16px;
  font-weight: 700;
  color: var(--text-1);
  border-bottom: 1px solid var(--line);
}
.sb-brand .lucide { width: 20px; height: 20px; color: var(--primary); }

.sb-menu { flex: 1; overflow-y: auto; padding: 12px 8px; }
.sb-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  border: none;
  background: none;
  padding: 10px 12px;
  border-radius: var(--radius-m);
  font-size: 14px;
  color: var(--text-2);
  cursor: pointer;
  text-align: left;
}
.sb-item:hover { background: var(--bg); color: var(--text-1); }
.sb-item.active { color: var(--primary); font-weight: 600; }
.sb-item .chev { margin-left: auto; width: 14px; height: 14px; color: var(--text-3); }
.sub-item {
  display: block;
  padding: 9px 12px 9px 40px;
  border-radius: var(--radius-m);
  font-size: 14px;
  color: var(--text-2);
  cursor: pointer;
}
.sub-item:hover { background: var(--bg); color: var(--text-1); }
.sub-item.active { background: var(--primary-weak); color: var(--primary); font-weight: 500; }

/* ---------------- 按钮 ---------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 32px;
  padding: 0 16px;
  border-radius: var(--radius-m);
  border: 1px solid transparent;
  font-size: 14px;
  cursor: pointer;
  background: none;
  transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: #2559C4; }
.btn-outline { border-color: var(--line); color: var(--text-2); background: var(--card); }
.btn-outline:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.btn-sm { height: 28px; padding: 0 12px; font-size: 12px; border-radius: var(--radius-s); }
.icon-btn {
  width: 32px;
  height: 32px;
  border: none;
  background: none;
  border-radius: var(--radius-s);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  cursor: pointer;
}
.icon-btn:hover { background: var(--bg); color: var(--text-1); }
.link-btn {
  border: none;
  background: none;
  color: var(--primary);
  font-size: 13px;
  cursor: pointer;
  padding: 0;
}
.link-btn:hover:not(:disabled) { text-decoration: underline; }
.link-btn:disabled { color: var(--text-3); cursor: not-allowed; }
.link-btn-danger { color: var(--danger); }
.link-btn-danger:disabled { color: var(--text-3); }

/* ---------------- 标签 ---------------- */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-s);
  font-size: 12px;
  background: #F2F3F5;
  color: var(--text-2);
  line-height: 20px;
}
.tag-success { background: #E8F7F0; color: var(--success); }

/* ---------------- 表单控件 ---------------- */
.input, .select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  padding: 6px 12px;
  font-size: 14px;
  font-family: var(--font);
  color: var(--text-1);
  background: var(--card);
  outline: none;
  transition: border-color .15s;
}
.input { height: 32px; }
.input::placeholder { color: var(--text-3); }
.input:focus, .select:focus { border-color: var(--primary); }
.select { height: 32px; cursor: pointer; }

.field-error {
  font-size: 12px;
  color: var(--danger);
  line-height: 1.4;
  margin-top: 4px;
}
.field-hint {
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.4;
  margin-top: 4px;
}
.cell-edit.has-error .input,
.cell-edit.has-error .select { border-color: var(--danger); }

/* ---------------- 卡片 ---------------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 24px;
}
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }

/* ---------------- 表格 ---------------- */
.table { width: 100%; border-collapse: collapse; }
.table th, .table td {
  text-align: left;
  padding: 0 16px;
  height: 44px;
  font-size: 14px;
  border-bottom: 1px solid var(--line);
}
.table th { color: var(--text-3); font-weight: 500; font-size: 12px; white-space: nowrap; }
.table td { color: var(--text-1); }
.table tbody tr:hover { background: #FAFBFC; }
.table-nowrap th, .table-nowrap td { white-space: nowrap; }
.table .col-ops { white-space: nowrap; width: 1%; }
.table .col-ops .link-btn { margin-right: 12px; }
.table .col-ops .link-btn:last-child { margin-right: 0; }
.table-scroll { overflow: auto; scrollbar-gutter: stable; }
.table-card { padding: 20px 24px; }
.table-empty { text-align: center; color: var(--text-3); padding: 32px 16px; }

/* ---------------- 页面骨架 ---------------- */
.page-main { padding: 24px 32px; max-width: 1440px; margin: 0 auto; }
.page-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
.page-desc { font-size: 14px; color: var(--text-3); }
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}
.page-header-actions { display: flex; align-items: center; gap: 8px; }

/* ---------------- 筛选区 ---------------- */
.filter-card { padding: 16px 24px; margin-bottom: 16px; }
.filter-row { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; }
.filter-item { display: flex; align-items: center; gap: 8px; }
.filter-label { font-size: 13px; color: var(--text-2); flex: none; }
.filter-item .input { width: auto; min-width: 180px; }
.filter-item .select { width: auto; min-width: 120px; }
.filter-actions { margin-left: auto; display: flex; gap: 8px; }

/* ---------------- 分页 ---------------- */
.table-footer { display: flex; justify-content: flex-end; align-items: center; margin-top: 16px; }
.pagination { display: flex; align-items: center; gap: 4px; }
.page-btn {
  min-width: 28px;
  height: 28px;
  padding: 0 6px;
  border: 1px solid var(--line);
  border-radius: var(--radius-s);
  background: var(--card);
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.page-btn:hover:not(:disabled):not(.active) { border-color: var(--primary); color: var(--primary); }
.page-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.page-btn:disabled { opacity: .4; cursor: not-allowed; }
.page-total { font-size: 12px; color: var(--text-3); margin-right: 8px; }

/* ---------------- 渠道图标 ---------------- */
.platform-icons { display: inline-flex; gap: 4px; align-items: center; }
.platform-dot {
  width: 22px; height: 22px;
  border-radius: var(--radius-s);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: #fff;
  font-weight: 600;
}
.platform-dot.tg { background: #229ED9; }
.platform-dot.wa { background: #25D366; }
.platform-dot.vb { background: #7360F2; }
.platform-dot.ms { background: #0084FF; }

/* ---------------- 抽屉 ---------------- */
.drawer-root {
  position: fixed;
  inset: 0;
  z-index: 100;
  visibility: hidden;
  pointer-events: none;
}
.drawer-root.open { visibility: visible; pointer-events: auto; }
.drawer-mask {
  position: absolute;
  inset: 0;
  background: rgba(31, 35, 41, .45);
  opacity: 0;
  transition: opacity .25s;
}
.drawer-root.open .drawer-mask { opacity: 1; }
.drawer {
  position: absolute;
  top: 0;
  right: 0;
  height: 100%;
  background: var(--card);
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform .28s ease;
}
.drawer-root.open .drawer { transform: translateX(0); }
.drawer-md { width: 42vw; min-width: 560px; }
.drawer-lg { width: 64vw; min-width: 820px; }
.drawer-header {
  height: 56px;
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  border-bottom: 1px solid var(--line);
}
.drawer-header h3 { font-size: 18px; font-weight: 600; }
.drawer-body { flex: 1; overflow-y: auto; padding: 24px; }
.drawer-footer {
  flex: none;
  border-top: 1px solid var(--line);
  padding: 12px 24px;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: var(--card);
}

.al-toolbar {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.al-row-editing { background: var(--primary-weak) !important; }
.al-row-editing td { vertical-align: top; padding-top: 8px; padding-bottom: 8px; height: auto; }

/* ---------------- Toast ---------------- */
#toast-root {
  position: fixed;
  top: 72px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--text-1);
  color: #fff;
  font-size: 13px;
  padding: 8px 16px;
  border-radius: var(--radius-m);
  opacity: 0;
  transition: opacity .2s;
  white-space: nowrap;
}
.toast.show { opacity: 1; }
.toast.err { background: var(--danger); }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sb-brand"><i data-lucide="bot"></i>Digiplus</div>
    <nav class="sb-menu">
      <div class="menu-group">
        <button class="sb-item active" type="button">
          <i data-lucide="bot"></i>机器人
          <i data-lucide="chevron-down" class="chev"></i>
        </button>
        <div class="submenu">
          <a class="sub-item active" href="javascript:;">社交聊天机器人</a>
          <a class="sub-item" href="javascript:;">对话流程</a>
          <a class="sub-item" href="javascript:;">用户管理</a>
        </div>
      </div>
    </nav>
  </aside>

  <div class="app-content">
    <header class="topbar">
      <div class="topbar-menu">
        <a class="topbar-item active" href="javascript:;">运营中心</a>
        <a class="topbar-item" href="javascript:;">玩家</a>
        <a class="topbar-item" href="javascript:;">设置</a>
      </div>
      <div class="topbar-user"><span class="avatar">M</span>marvin@</div>
    </header>

    <div class="content-body">
      <main class="page-main" id="content"></main>
    </div>
  </div>
</div>

<div id="drawer-host"></div>
<div id="toast-root"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
/* =========================================================
 *  MOCK DATA
 * ========================================================= */
const MOCK = {
  bots: [
    {
      id: 'bot_1',
      botName: 'BingoPlus_Official',
      botToken: '7283****:AAH****CmKpq',
      botUsername: '@BingoPlusBot',
      platforms: ['tg', 'wa', 'vb', 'ms'],
      status: 'SUCCESS',
      createTime: '2026-05-12 10:24:18',
      autoLoginPages: [
        { id: 'al_1', autoLoginUrl: 'https://example.com/order', pageType: 'H5', palCode: 'TG_ORDER' },
        { id: 'al_2', autoLoginUrl: 'https://example.com/mini/wallet', pageType: 'Mini App', palCode: 'TG_WALLET' }
      ]
    },
    {
      id: 'bot_2',
      botName: 'Rewards_Support',
      botToken: '6691****:AAG****QwxRt',
      botUsername: '@RewardsSupportBot',
      platforms: ['tg', 'ms'],
      status: 'SUCCESS',
      createTime: '2026-06-03 15:41:02',
      autoLoginPages: [
        { id: 'al_3', autoLoginUrl: 'https://rewards.example.com/claim', pageType: 'H5', palCode: 'RW_CLAIM' }
      ]
    },
    {
      id: 'bot_3',
      botName: 'GameLobby_Bot',
      botToken: '5510****:AAF****LpZyT',
      botUsername: '@GameLobbyBot',
      platforms: ['tg', 'wa'],
      status: 'SUCCESS',
      createTime: '2026-07-01 09:12:45',
      autoLoginPages: []
    }
  ]
};

/* =========================================================
 *  STATE
 * ========================================================= */
const state = {
  filters: {
    botName: '',
    botToken: '',
    botUsername: '',
    platform: ''
  },
  // Auto-login config drawer
  al: {
    open: false,
    botId: null,
    // null = none; '__new__' = creating new row; pageId = editing that row
    editingKey: null
  }
};

let idSeq = 100;

/* =========================================================
 *  UTILS
 * ========================================================= */
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function refreshIcons() {
  if (window.lucide) window.lucide.createIcons();
}

function toast(msg, type) {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'err' ? ' err' : '');
  el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 200);
  }, 2200);
}

function getBot(id) {
  return MOCK.bots.find(b => b.id === id);
}

function nextId(prefix) {
  idSeq += 1;
  return prefix + '_' + idSeq;
}

function isValidUrl(str) {
  try {
    const u = new URL(str);
    return u.protocol === 'http:' || u.protocol === 'https:';
  } catch (_) {
    return false;
  }
}

function platformLabel(key) {
  const map = { tg: 'Telegram', wa: 'WhatsApp', vb: 'Viber', ms: 'Messenger' };
  return map[key] || key;
}

function renderPlatformIcons(platforms) {
  return `<span class="platform-icons">${(platforms || []).map(p =>
    `<span class="platform-dot ${esc(p)}" title="${esc(platformLabel(p))}">${esc(p === 'tg' ? 'T' : p === 'wa' ? 'W' : p === 'vb' ? 'V' : 'M')}</span>`
  ).join('')}</span>`;
}

/* =========================================================
 *  AUTO LOGIN DRAWER (list + inline edit)
 * ========================================================= */
function closeAutoLoginModal() {
  state.al = { open: false, botId: null, editingKey: null };
  const host = document.getElementById('drawer-host');
  const root = document.getElementById('al-drawer');
  if (!root) {
    host.innerHTML = '';
    return;
  }
  root.classList.remove('open');
  setTimeout(() => {
    if (!state.al.open) host.innerHTML = '';
  }, 280);
}

function onDrawerMaskClick() {
  if (state.al.editingKey) {
    toast('请先保存或取消当前编辑', 'err');
    return;
  }
  closeAutoLoginModal();
}

function openAutoLoginConfig(botId) {
  const bot = getBot(botId);
  if (!bot) {
    toast('未找到该 Bot', 'err');
    return;
  }
  state.al = { open: true, botId, editingKey: null };
  renderAutoLoginModal();
}

function renderAutoLoginModal() {
  const { botId, editingKey } = state.al;
  const bot = getBot(botId);
  if (!bot) {
    closeAutoLoginModal();
    return;
  }

  const pages = bot.autoLoginPages || [];
  const isCreating = editingKey === '__new__';
  const isEditing = !!editingKey;

  const rowsHtml = pages.map(p => {
    if (editingKey === p.id) {
      return renderEditRow(botId, p.id, p);
    }
    return `
      <tr data-page-id="${esc(p.id)}">
        <td>${esc(p.autoLoginUrl)}</td>
        <td class="col-ops">
          <button class="link-btn" type="button" ${isEditing ? 'disabled' : ''} onclick="startInlineEdit('${esc(botId)}','${esc(p.id)}')">编辑</button>
          <button class="link-btn link-btn-danger" type="button" ${isEditing ? 'disabled' : ''} onclick="deleteAutoLoginPage('${esc(botId)}','${esc(p.id)}')">删除</button>
        </td>
      </tr>`;
  }).join('');

  const emptyRow = !pages.length && !isCreating
    ? `<tr><td colspan="2"><div class="table-empty">暂无自动登录页面，请点击上方「新增」</div></td></tr>`
    : '';

  const newRow = isCreating
    ? renderEditRow(botId, '__new__', { autoLoginUrl: '' })
    : '';

  const bodyHtml = `
    <div class="al-toolbar">
      <button class="btn btn-primary" type="button" ${isEditing ? 'disabled' : ''} onclick="startInlineCreate('${esc(botId)}')">
        <i data-lucide="plus"></i>新增
      </button>
    </div>
    <div class="table-scroll">
      <table class="table" id="al-table">
        <thead>
          <tr>
            <th style="min-width:260px;">自动登录URL<span class="req">*</span></th>
            <th class="col-ops">操作</th>
          </tr>
        </thead>
        <tbody>
          ${rowsHtml}
          ${emptyRow}
          ${newRow}
        </tbody>
      </table>
    </div>`;

  const host = document.getElementById('drawer-host');
  let root = document.getElementById('al-drawer');

  if (!root) {
    host.innerHTML = `
      <div class="drawer-root" id="al-drawer">
        <div class="drawer-mask" onclick="onDrawerMaskClick()"></div>
        <aside class="drawer drawer-md" role="dialog" aria-modal="true">
          <header class="drawer-header">
            <h3 id="al-drawer-title"></h3>
            <button class="icon-btn" type="button" aria-label="关闭" onclick="closeAutoLoginModal()"><i data-lucide="x"></i></button>
          </header>
          <div class="drawer-body" id="al-drawer-body"></div>
          <footer class="drawer-footer">
            <button class="btn btn-outline" type="button" onclick="closeAutoLoginModal()">关闭</button>
          </footer>
        </aside>
      </div>`;
    root = document.getElementById('al-drawer');
    requestAnimationFrame(() => root.classList.add('open'));
  } else if (!root.classList.contains('open')) {
    root.classList.add('open');
  }

  document.getElementById('al-drawer-title').textContent = `自动登录配置 · ${bot.botName}`;
  document.getElementById('al-drawer-body').innerHTML = bodyHtml;
  refreshIcons();

  if (isEditing) {
    setTimeout(() => {
      const input = document.getElementById('al-inline-url');
      if (input) input.focus();
    }, 0);
  }
}

function renderEditRow(botId, key, data) {
  return `
    <tr class="al-row-editing" data-edit-key="${esc(key)}">
      <td>
        <div class="cell-edit" id="al-url-cell">
          <input class="input" id="al-inline-url" type="text" placeholder="请输入自动登录页面URL" value="${esc(data.autoLoginUrl || '')}" />
          <div class="field-error" id="al-url-error"></div>
        </div>
      </td>
      <td class="col-ops">
        <button class="link-btn" type="button" onclick="saveInlineRow('${esc(botId)}','${esc(key)}')">保存</button>
        <button class="link-btn" type="button" onclick="cancelInlineEdit()">取消</button>
      </td>
    </tr>`;
}

function startInlineCreate(botId) {
  if (state.al.editingKey) {
    toast('请先保存或取消当前编辑', 'err');
    return;
  }
  state.al.botId = botId;
  state.al.editingKey = '__new__';
  renderAutoLoginModal();
}

function startInlineEdit(botId, pageId) {
  if (state.al.editingKey) {
    toast('请先保存或取消当前编辑', 'err');
    return;
  }
  const bot = getBot(botId);
  if (!bot || !(bot.autoLoginPages || []).some(p => p.id === pageId)) {
    toast('未找到该自动登录页面', 'err');
    return;
  }
  state.al.botId = botId;
  state.al.editingKey = pageId;
  renderAutoLoginModal();
}

function cancelInlineEdit() {
  state.al.editingKey = null;
  renderAutoLoginModal();
}

function clearInlineErrors() {
  ['url'].forEach(key => {
    const cell = document.getElementById('al-' + key + '-cell');
    const err = document.getElementById('al-' + key + '-error');
    if (cell) cell.classList.remove('has-error');
    if (err) err.textContent = '';
  });
}

function setInlineError(key, message) {
  const cell = document.getElementById('al-' + key + '-cell');
  const err = document.getElementById('al-' + key + '-error');
  if (cell) cell.classList.add('has-error');
  if (err) err.textContent = message || '';
}

function validateInlineRow(botId) {
  clearInlineErrors();
  const bot = getBot(botId);
  if (!bot) return null;

  const autoLoginUrl = (document.getElementById('al-inline-url')?.value || '').trim();

  let ok = true;

  if (!autoLoginUrl) {
    setInlineError('url', '请输入自动登录URL');
    ok = false;
  } else if (!isValidUrl(autoLoginUrl)) {
    setInlineError('url', '请输入正确的URL地址');
    ok = false;
  }

  if (!ok) return null;
  return { autoLoginUrl };
}

function saveInlineRow(botId, editingKey) {
  const bot = getBot(botId);
  if (!bot) return;

  const data = validateInlineRow(botId);
  if (!data) return;

  if (!bot.autoLoginPages) bot.autoLoginPages = [];

  if (editingKey === '__new__') {
    bot.autoLoginPages.push({
      id: nextId('al'),
      autoLoginUrl: data.autoLoginUrl,
      pageType: 'H5',
      palCode: nextId('PAL').toUpperCase().replace(/-/g, '_')
    });
    state.al.editingKey = null;
    renderAutoLoginModal();
    toast('自动登录页面已新增');
  } else {
    const page = bot.autoLoginPages.find(p => p.id === editingKey);
    if (!page) {
      toast('未找到该自动登录页面', 'err');
      return;
    }
    page.autoLoginUrl = data.autoLoginUrl;
    state.al.editingKey = null;
    renderAutoLoginModal();
    toast('自动登录页面已更新');
  }
}

function deleteAutoLoginPage(botId, pageId) {
  if (state.al.editingKey) {
    toast('请先保存或取消当前编辑', 'err');
    return;
  }
  const bot = getBot(botId);
  if (!bot) return;
  const idx = (bot.autoLoginPages || []).findIndex(p => p.id === pageId);
  if (idx < 0) return;
  if (!confirm('确认删除该自动登录页面？')) return;
  bot.autoLoginPages.splice(idx, 1);
  renderAutoLoginModal();
  toast('已删除');
}

/* =========================================================
 *  BOT LIST VIEW
 * ========================================================= */
function applyFilters() {
  state.filters.botName = (document.getElementById('f-bot-name')?.value || '').trim();
  state.filters.botToken = (document.getElementById('f-bot-token')?.value || '').trim();
  state.filters.botUsername = (document.getElementById('f-bot-username')?.value || '').trim();
  state.filters.platform = document.getElementById('f-platform')?.value || '';
  render();
}

function resetFilters() {
  state.filters = { botName: '', botToken: '', botUsername: '', platform: '' };
  render();
}

function filterBots() {
  const f = state.filters;
  return MOCK.bots.filter(b => {
    if (f.botName && !b.botName.toLowerCase().includes(f.botName.toLowerCase())) return false;
    if (f.botToken && !b.botToken.toLowerCase().includes(f.botToken.toLowerCase())) return false;
    if (f.botUsername && !b.botUsername.toLowerCase().includes(f.botUsername.toLowerCase())) return false;
    if (f.platform && !(b.platforms || []).includes(f.platform)) return false;
    return true;
  });
}

function showBotList() {
  const list = filterBots();
  const f = state.filters;

  return `
    <div class="page-header">
      <div>
        <h1 class="page-title">社交聊天机器人</h1>
        <p class="page-desc">管理各平台 Bot 的接入信息，并为 Bot 配置自动登录页面</p>
      </div>
      <div class="page-header-actions">
        <button class="btn btn-primary" type="button" onclick="toast('原型未接创建','err')">
          <i data-lucide="plus"></i>创建
        </button>
      </div>
    </div>

    <section class="card filter-card">
      <div class="filter-row">
        <div class="filter-item">
          <span class="filter-label">Bot Name</span>
          <input class="input" id="f-bot-name" type="text" placeholder="请输入Bot Name" value="${esc(f.botName)}" />
        </div>
        <div class="filter-item">
          <span class="filter-label">Bot Token</span>
          <input class="input" id="f-bot-token" type="text" placeholder="请输入Bot Token" value="${esc(f.botToken)}" />
        </div>
        <div class="filter-item">
          <span class="filter-label">Bot Username</span>
          <input class="input" id="f-bot-username" type="text" placeholder="请输入Bot Username" value="${esc(f.botUsername)}" />
        </div>
        <div class="filter-item">
          <span class="filter-label">Platform</span>
          <select class="select" id="f-platform">
            <option value="">全部</option>
            <option value="tg" ${f.platform === 'tg' ? 'selected' : ''}>Telegram</option>
            <option value="wa" ${f.platform === 'wa' ? 'selected' : ''}>WhatsApp</option>
            <option value="vb" ${f.platform === 'vb' ? 'selected' : ''}>Viber</option>
            <option value="ms" ${f.platform === 'ms' ? 'selected' : ''}>Messenger</option>
          </select>
        </div>
        <div class="filter-actions">
          <button class="btn btn-primary" type="button" onclick="applyFilters()">搜索</button>
          <button class="btn btn-outline" type="button" onclick="resetFilters()">重置</button>
        </div>
      </div>
    </section>

    <section class="card table-card">
      <h4 class="card-title">Bot 列表</h4>
      <div class="table-scroll">
        <table class="table table-nowrap">
          <thead>
            <tr>
              <th>Bot Name</th>
              <th>Bot Token</th>
              <th>Bot Username</th>
              <th>Platform</th>
              <th>Status</th>
              <th>Create Time</th>
              <th class="col-ops">操作</th>
            </tr>
          </thead>
          <tbody>
            ${list.length ? list.map(b => `
              <tr>
                <td>${esc(b.botName)}</td>
                <td>${esc(b.botToken)}</td>
                <td>${esc(b.botUsername)}</td>
                <td>${renderPlatformIcons(b.platforms)}</td>
                <td><span class="tag tag-success">${esc(b.status)}</span></td>
                <td>${esc(b.createTime)}</td>
                <td class="col-ops">
                  <button class="link-btn" type="button" onclick="openAutoLoginConfig('${esc(b.id)}')">自动登录</button>
                  <button class="link-btn" type="button" onclick="toast('原型未接 Bot 编辑','err')">编辑</button>
                  <button class="link-btn link-btn-danger" type="button" onclick="toast('原型未接 Bot 删除','err')">删除</button>
                </td>
              </tr>`).join('') : `
              <tr><td colspan="7"><div class="table-empty">暂无数据</div></td></tr>`}
          </tbody>
        </table>
      </div>
      <div class="table-footer">
        <span class="page-total">共 ${list.length} 条</span>
        <div class="pagination">
          <button class="page-btn" type="button" disabled>‹</button>
          <button class="page-btn active" type="button">1</button>
          <button class="page-btn" type="button" disabled>›</button>
        </div>
      </div>
    </section>`;
}

function render() {
  document.getElementById('content').innerHTML = showBotList();
  refreshIcons();
}

render();
</script>
</body>
</html>
