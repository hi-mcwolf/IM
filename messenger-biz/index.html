<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digiplus · Messenger Business Message</title>
  <style>
:root {
  --bg: #F5F6F8;
  --card: #FFFFFF;
  --primary: #2E6BE6;
  --primary-hover: #2559C4;
  --primary-weak: #EEF4FF;
  --primary-border: #C9DBFF;
  --line: #E5E7EB;
  --border: #E5E7EB;
  --text: #1F2329;
  --text-1: #1F2329;
  --text-2: #4E5969;
  --text-3: #86909C;
  --muted: #86909C;
  --danger: #E5484D;
  --danger-hover: #C9373C;
  --success: #2BA471;
  --success-hover: #259365;
  --info: #2E6BE6;
  --warn: #FF7D00;
  --warning: #FF7D00;
  --radius-s: 4px;
  --radius-m: 6px;
  --radius-l: 8px;
  --sidebar-w: 220px;
  --header-h: 56px;
  --font: "PingFang SC", "Microsoft YaHei", "微软雅黑", Inter, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--text-1);
  background: var(--bg);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
button { font-family: var(--font); }
a { text-decoration: none; color: inherit; }
.lucide { width: 16px; height: 16px; stroke-width: 1.8; flex: none; }

.app-layout { display: flex; height: 100vh; overflow: hidden; }
.app-content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.content-body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; }

.topbar {
  height: 56px;
  flex: none;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px 0 0;
}
.topbar-menu { display: flex; align-items: center; height: 100%; }
.topbar-item {
  position: relative;
  display: flex;
  align-items: center;
  height: 100%;
  padding: 0 24px;
  font-size: 14px;
  color: var(--text-2);
}
.topbar-item.active { color: var(--primary); font-weight: 600; }
.topbar-item.active::after {
  content: "";
  position: absolute;
  left: 24px;
  right: 24px;
  bottom: 0;
  height: 2px;
  background: var(--primary);
}
.topbar-actions { display: flex; align-items: center; gap: 12px; }
.topbar-user {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-2);
}
.topbar-user .avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--primary-weak);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
}

.sidebar {
  width: var(--sidebar-w);
  flex: none;
  background: var(--card);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
}
.sb-brand {
  height: 56px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 20px;
  font-size: 16px;
  font-weight: 700;
  color: var(--text-1);
  border-bottom: 1px solid var(--line);
}
.sb-brand .lucide { width: 20px; height: 20px; color: var(--primary); }
.sb-menu { flex: 1; overflow-y: auto; padding: 12px 8px; }
.sb-item, .sub-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  border: none;
  background: none;
  padding: 10px 12px;
  border-radius: var(--radius-m);
  font-size: 14px;
  color: var(--text-2);
  cursor: pointer;
  text-align: left;
  font-family: inherit;
}
.sb-item:hover, .sub-item:hover { background: var(--bg); color: var(--text-1); }
.sb-item.active { color: var(--primary); font-weight: 600; }
.sb-item .chev {
  margin-left: auto;
  width: 14px;
  height: 14px;
  color: var(--text-3);
}
.sub-item { padding: 9px 12px 9px 40px; display: block; }
.sub-item.active { background: var(--primary-weak); color: var(--primary); font-weight: 500; }
.menu-group { margin-top: 4px; }

.menu-toggle {
  display: none !important;
  height: 28px;
  padding: 0 12px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text-2);
  border-radius: var(--radius-m);
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
}
.stats-main { padding: 24px 32px; max-width: 1440px; margin: 0 auto; }
.stats-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 24px;
  gap: 12px;
  flex-wrap: wrap;
}
.page-title { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
.page-desc { font-size: 14px; color: var(--text-3); margin: 0; }
.stats-header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.breadcrumb { display: none; }
.page-head { display: none; }

.page-tabs {
  display: flex;
  align-items: center;
  gap: 24px;
  border-bottom: 1px solid var(--line);
  margin: -8px 0 16px;
}
.page-tab {
  position: relative;
  padding: 0 2px 10px;
  font-size: 14px;
  color: var(--text-2);
  cursor: pointer;
  user-select: none;
}
.page-tab:hover { color: var(--text-1); }
.page-tab.active { color: var(--primary); font-weight: 600; }
.page-tab.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: var(--primary);
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 24px;
}
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 16px 24px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 16px 24px;
  margin-bottom: 16px;
}
.filter-item {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: auto;
  flex: 0 0 auto;
}
.filter-item.wide { min-width: 280px; }
.filter-item label, .form-row > label {
  font-size: 13px;
  color: var(--text-2);
  white-space: nowrap;
  margin: 0;
}
.filter-item input, .filter-item select { width: auto; min-width: 140px; }
.filter-item.wide input { min-width: 0; flex: 1; }
.filter-actions {
  flex: 1 0 100%;
  margin-left: 0;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: nowrap;
}

input[type="text"], input[type="password"], input[type="number"], input[type="url"],
input[type="datetime-local"], input[type="file"], select, textarea {
  height: 32px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  font-size: 14px;
  color: var(--text-1);
  background: var(--card);
  outline: none;
  width: 100%;
  font-family: inherit;
  transition: border-color .15s;
}
textarea { height: auto; min-height: 96px; padding: 8px 12px; resize: vertical; line-height: 1.6; }
input[type="file"] { padding: 3px 8px; }
input::placeholder, textarea::placeholder { color: var(--text-3); }
input:hover, select:hover, textarea:hover { border-color: var(--primary); }
input:focus, select:focus, textarea:focus { border-color: var(--primary); }
.has-error input, .has-error select, .has-error textarea { border-color: var(--danger); }
.req { color: var(--danger); margin-left: 2px; }
input[type="radio"], input[type="checkbox"] { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 32px;
  padding: 0 16px;
  border-radius: var(--radius-m);
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text-2);
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s;
  user-select: none;
}
.btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.btn.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover:not(:disabled) { background: var(--danger-hover); border-color: var(--danger-hover); color: #fff; }
.btn.sm { height: 28px; padding: 0 12px; font-size: 12px; border-radius: var(--radius-s); }
.btn.link { border: none; background: transparent; color: var(--primary); height: 28px; padding: 0 6px; }
.btn.link:hover { color: var(--primary-hover); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:disabled:hover { border-color: var(--line); color: var(--text-2); }
.btn.primary:disabled:hover { color: #fff; border-color: var(--primary); }

.tbl-wrap {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  overflow-x: auto;
}
.tbl-wrap:has(+ .pagination) {
  border-bottom: none;
  border-radius: var(--radius-l) var(--radius-l) 0 0;
}
.tbl-wrap + .pagination {
  background: var(--card);
  border: 1px solid var(--line);
  border-top: none;
  border-radius: 0 0 var(--radius-l) var(--radius-l);
  margin-top: 0;
  padding: 12px 16px 16px;
}
table.tbl {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font);
  font-size: 13px;
}
.tbl th, .tbl td {
  padding: 0 16px;
  height: 44px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
  font-family: inherit;
  font-size: 13px;
  font-weight: 400;
  color: var(--text-1);
}
.tbl th {
  background: var(--card);
  color: var(--text-3);
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
.tbl th.no-sort { cursor: default; }
.tbl th .arrow { color: var(--text-3); font-size: 10px; margin-left: 4px; font-family: inherit; }
.tbl th.sorted .arrow { color: var(--primary); }
.tbl tbody tr:hover { background: #FAFBFC; }
.tbl .col-actions { white-space: nowrap; width: 1%; }
.tbl .mono {
  font-family: inherit;
  font-size: inherit;
  color: var(--text-1);
}
.tbl .col-actions .btn.sm {
  border: none;
  background: none;
  color: var(--primary);
  height: auto;
  padding: 0 10px 0 0;
  font-family: inherit;
  font-size: 13px;
  font-weight: 400;
}
.tbl .col-actions .btn.sm:hover { text-decoration: underline; }
.tbl .col-actions .btn.sm.danger { color: var(--danger); background: none; }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-s);
  font-family: inherit;
  font-size: 12px;
  line-height: 20px;
  font-weight: 500;
  border: none;
  white-space: nowrap;
  background: #F2F3F5;
  color: var(--text-2);
}
.tag.pending { color: var(--text-2); background: #F2F3F5; }
.tag.sending, .tag.info { color: var(--primary); background: var(--primary-weak); }
.tag.success { color: var(--success); background: #E8F7F0; }
.tag.failed { color: var(--danger); background: #FDEBEC; }
.tag.off { color: var(--text-3); background: #F2F3F5; }
.tag.warn { color: var(--warning); background: #FFF3E6; }

.empty { text-align: center; padding: 48px 16px; color: var(--text-3); }
.loading { text-align: center; padding: 48px 16px; color: var(--text-3); }
.spinner {
  width: 22px; height: 22px;
  border: 2px solid var(--line);
  border-top-color: var(--primary);
  border-radius: 50%;
  display: inline-block;
  animation: spin .8s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.page-total { font-size: 12px; color: var(--text-3); margin-right: 8px; }
.pagination {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 4px;
  margin-top: 16px;
  color: var(--text-3);
  font-size: 12px;
  padding: 0 8px 16px;
}
.tbl-wrap + .pagination, .tbl-wrap .pagination { padding: 12px 16px 16px; }
.pg-btn {
  min-width: 28px; height: 28px;
  padding: 0 6px;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: var(--radius-s);
  cursor: pointer;
  color: var(--text-2);
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.pg-btn:hover:not(:disabled):not(.active) { border-color: var(--primary); color: var(--primary); }
.pg-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.pg-btn:disabled { opacity: .4; cursor: not-allowed; }
.field-error { font-size: 12px; color: var(--danger); line-height: 1.4; margin-top: 4px; }
.tbl-add { margin-top: 12px; }
.tbl .draft-row > td { background: var(--primary-weak); vertical-align: top; }
.tbl .draft-row input, .tbl .draft-row select { width: 100%; min-width: 120px; }
.tbl .draft-row .col-actions { white-space: nowrap; }
.field-hint { font-size: 12px; color: var(--text-3); line-height: 1.4; margin-top: 4px; }
.hint-bar {
  background: var(--primary-weak);
  border: 1px solid var(--primary-border);
  color: var(--primary);
  padding: 8px 12px;
  border-radius: var(--radius-m);
  font-size: 13px;
  margin: 4px 0 12px;
}
.warn-bar {
  background: #FFF3E6;
  border: 1px solid #FFD9B3;
  color: var(--warning);
  padding: 8px 12px;
  border-radius: var(--radius-m);
  font-size: 13px;
  margin: 4px 0 12px;
}
.mask {
  position: fixed; inset: 0;
  background: rgba(31, 35, 41, .45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
}
.modal {
  width: 640px;
  max-width: 100%;
  background: var(--card);
  border-radius: var(--radius-l);
  box-shadow: 0 8px 24px rgba(31, 35, 41, .12);
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 32px);
}
.modal.lg { width: 860px; }
.modal.xl { width: 1100px; }
.modal .preview-card { position: static; }
.modal-hd {
  height: 56px;
  padding: 0 24px;
  border-bottom: 1px solid var(--line);
  font-weight: 600;
  font-size: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.modal-hd .x { cursor: pointer; color: var(--text-3); padding: 4px; }
.modal-hd .x:hover { color: var(--text-1); }
.modal-bd { padding: 24px; overflow: auto; }
.modal-ft {
  padding: 12px 24px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: var(--card);
  border-radius: 0 0 var(--radius-l) var(--radius-l);
  flex-shrink: 0;
}
#toast-root {
  position: fixed;
  top: 72px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1100;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--text-1);
  border-radius: var(--radius-m);
  padding: 8px 16px;
  color: #fff;
  font-size: 13px;
  animation: toast-in .2s ease;
  pointer-events: auto;
  border: none;
}
.toast.ok, .toast.err { border: none; }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
.form-row { margin-bottom: 24px; }
.form-row > label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--text-1); white-space: normal; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.chk-list {
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  padding: 8px 10px;
  max-height: 148px;
  overflow: auto;
  background: #fff;
}
.chk-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
.chk-item input { width: auto; height: auto; }
.radio-row { display: flex; gap: 16px; align-items: center; height: 32px; }
.radio-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-2); }
.radio-row input { width: auto; height: auto; }
.create-layout { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
.preview-card {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 16px;
  position: sticky;
  top: 0;
}
.msgr {
  background: #fff;
  border-radius: var(--radius-l);
  overflow: hidden;
  border: 1px solid var(--line);
}
.msgr-hd {
  background: #0084ff;
  color: #fff;
  padding: 10px 12px;
  font-weight: 600;
  font-size: 13px;
}
.msgr-bd { padding: 12px; }
.msgr-img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  background: var(--primary-weak);
  display: block;
  border-radius: var(--radius-m);
  margin-bottom: 8px;
}
.msgr-img.ph {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  font-size: 12px;
}
.msgr-title { font-weight: 600; margin-bottom: 6px; }
.msgr-body { color: var(--text-2); font-size: 13px; white-space: pre-wrap; line-height: 1.5; }
.msgr-cta {
  margin-top: 10px;
  background: #0084ff;
  color: #fff;
  text-align: center;
  padding: 8px;
  border-radius: var(--radius-m);
  font-size: 13px;
  font-weight: 500;
}
.elig-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}
.elig-item {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  padding: 8px 10px;
}
.elig-item .n { font-size: 18px; font-weight: 600; color: var(--text-1); }
.elig-item .k { font-size: 12px; color: var(--text-3); }
.detail-dl { display: grid; grid-template-columns: 160px 1fr; gap: 8px 12px; font-size: 13px; }
.detail-dl dt { color: var(--text-3); }
.detail-dl dd { margin: 0; word-break: break-all; }
.sub-type-list { display: flex; flex-direction: column; gap: 12px; }
.sub-type-card {
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  padding: 12px 14px;
  background: var(--bg);
}
.sub-type-hd {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.stat-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 16px 20px;
}
.stat-card .n { font-size: 24px; font-weight: 700; }
.stat-card .k { font-size: 13px; color: var(--text-2); margin-top: 8px; }
.dash-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 4px; }
.dash-link {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 16px 20px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
}
.dash-link:hover { border-color: var(--primary); }
.dash-link .t { font-weight: 600; margin-bottom: 4px; }
.dash-link .d { font-size: 12px; color: var(--text-3); }

@media (max-width: 1100px) {
  .create-layout { grid-template-columns: 1fr; }
  .preview-card { position: static; }
  .stat-grid, .dash-links { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .menu-toggle { display: inline-flex !important; }
  .sidebar { display: none; }
  .sidebar.open {
    display: flex;
    position: absolute;
    top: 0; bottom: 0; left: 0;
    z-index: 15;
    box-shadow: 4px 0 16px rgba(31, 35, 41, .08);
  }
  .filters .filter-item { min-width: calc(50% - 8px); flex: 1; }
  .stats-main { padding: 16px; }
}
@media (max-width: 560px) {
  .filters .filter-item { min-width: 100%; }
  .stat-grid, .dash-links { grid-template-columns: 1fr; }
  .detail-dl { grid-template-columns: 1fr; }
}

  </style>
</head>
<body>
<div class="app-layout" id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="app-content">
    <header class="topbar" id="topbar">
      <nav class="topbar-menu">
        <span class="topbar-item active">触达中心</span>

    if (!f.businessAccount.trim()) errors.businessAccount = '请填写 Business Account';
    const dup = store.accounts.some(a => a.businessAccount.trim() === f.businessAccount.trim() && a.id !== m.id);
    if (f.businessAccount.trim() && dup) errors.businessAccount = '该 Business Account 已存在';
    if (!m.id && !f.apiKey.trim()) errors.apiKey = '请填写 API Key';
    if (!m.id && !f.apiSecret.trim()) errors.apiSecret = '请填写 API Secret';
    if (!f.facebookPageIds.length) errors.facebookPageIds = '请至少选择一个 Facebook Page';
    if (!f.adAccountId) errors.adAccountId = '请选择 Ad Account';
    if (f.adAccountId && f.facebookPageIds.some(pid => !pageMatchesAd(pid, f.adAccountId))) {
      errors.adAccountId = 'Ad Account 必须与所选 Facebook Page 匹配';
    }
    m.errors = errors;
    if (Object.keys(errors).length) { renderModal(); return; }
    if (m.id) {
      const acc = store.accounts.find(a => a.id === m.id);
      acc.businessAccount = f.businessAccount.trim();
      if (f.apiKey.trim()) acc.apiKey = f.apiKey.trim();
      if (f.apiSecret.trim()) acc.apiSecret = f.apiSecret.trim();
      acc.facebookPageIds = f.facebookPageIds.slice();
      acc.adAccountId = f.adAccountId;
      acc.status = f.status;
      toast('商业账户已更新', 'ok');
    } else {
      store.accounts.unshift({
        id: nextId('acc'),
        platform: 'messenger',
        businessAccount: f.businessAccount.trim(),
        apiKey: f.apiKey.trim(),
        apiSecret: f.apiSecret.trim(),
        facebookPageIds: f.facebookPageIds.slice(),
        adAccountId: f.adAccountId,
        status: f.status,
        createdAt: toDisplayDt(new Date())
      });
      toast('商业账户已创建', 'ok');
    }
    saveStore();
    closeModal();
    renderPage();
  }

    const key = f.apiKey.trim() || (acc && acc.apiKey) || '';

    }
    if (!f.facebookPageIds.length || !f.adAccountId) {
      toast('请选择 Facebook Page 和 Ad Account 后再测试连接', 'err');
      return;

  function subTabKey() {
    return state.subTab === 'groups' ? 'subscription-group' : 'subscription';
  }
  function matchSubFilters(s, f) {
    if (f.platform && s.platform !== f.platform) return false;
    if (f.businessAccount && s.businessAccount !== f.businessAccount) return false;
    if (f.facebookPage && !(s.facebookPage || '').toLowerCase().includes(f.facebookPage.toLowerCase())) return false;
    if (f.loginName && !(s.loginName || '').toLowerCase().includes(f.loginName.toLowerCase())) return false;
    if (f.subscriptionType && s.subscriptionType !== f.subscriptionType) return false;
    if (!inRange(s.initialSubscriptionDate, f.initialFrom, f.initialTo)) return false;
    if (!inRange(s.latestSubscriptionTime, f.latestFrom, f.latestTo)) return false;
    if (!inRange(s.lastLoginTime, f.loginFrom, f.loginTo)) return false;
    if (!inRange(s.nextEligibleDatetime, f.eligibleFrom, f.eligibleTo)) return false;
    return true;
  }

  /* ========== Create subscription message ========== */
  function calcEligibility(form) {
    const tag = CATALOG.protosTags.find(t => t.name === form.protosTags);
    const target = form.uploadCount || (tag ? tag.count : 0);
    const subscribed = Math.floor(target * 0.22);
    const noInteraction = Math.floor(target * 0.11);
    const frequency = Math.floor(target * 0.07);
    const noMessengerId = Math.floor(target * 0.05);
    const eligible = Math.max(0, target - subscribed - noInteraction - frequency - noMessengerId);
    return { target, eligible, subscribed, noInteraction, frequency, noMessengerId };
  }

    const f = state.createForm;

    if (f.facebookPage && !pages.some(p => p.name === f.facebookPage) && pages[0]) f.facebookPage = pages[0].name;
    if (f.subscriptionType && !types.some(t => t.subscriptionType === f.subscriptionType)) f.subscriptionType = types[0] ? types[0].subscriptionType : '';
    const elig = calcEligibility(f);
    const inconsistent = f.subscriptionType && f.messageTitle && f.messageContent &&
      !(f.messageTitle.includes(f.subscriptionType) || f.messageContent.includes(f.subscriptionType));
    let html = '<div class="create-layout"><div>' +
      wrapErr(f.errors, 'platform', '<div class="form-row"><label>平台 / Platform<span class="req">*</span></label>' +
        '<select data-field="platform"><option value="messenger" selected>messenger</option></select></div>') +

  function eligItem(n, k) {
    return '<div class="elig-item"><div class="n">' + n + '</div><div class="k">' + esc(k) + '</div></div>';

  function submitCreate() {
    const f = state.createForm;
    const errors = {};
    if (f.platform !== 'messenger') errors.platform = '平台仅支持 messenger';
    if (!f.businessAccount) errors.businessAccount = '请选择商业账户';
    if (!f.facebookPage) errors.facebookPage = '请选择 Facebook Page';
    if (!f.subscriptionType) errors.subscriptionType = '请选择开启中的订阅类型';
    const tn = (f.taskName || '').trim();
    if (!tn) errors.taskName = '请填写任务名称';
    else if (tn.length < 1 || tn.length > 100) errors.taskName = '任务名称需为 1–100 个字符';
    if (!f.uploadCount && !f.protosTags) errors.target = '请通过 Upload 或 Protos Tags 选择目标用户';
    if (!(f.messageTitle || '').trim()) errors.messageTitle = '请填写消息标题';
    if (!(f.messageContent || '').trim()) errors.messageContent = '请填写消息内容';
    if (!f.button) errors.button = '请选择按钮 CTA';
    if (f.sendingTimeType === '定时') {
      const d = parseDt(f.scheduledAt);
      if (!d) errors.scheduledAt = '请选择定时发送时间';
      else if (d.getTime() <= Date.now()) errors.scheduledAt = '定时时间必须晚于当前时间';
    }
    const typeOk = store.subscriptionTypes.some(t => t.businessAccount === f.businessAccount && t.subscriptionType === f.subscriptionType && t.status === '开启');
    if (f.subscriptionType && !typeOk) errors.subscriptionType = '该订阅类型已关闭，不能新建订阅消息';
    f.errors = errors;
    if (Object.keys(errors).length) {
      refreshCreateUi();
      toast('请先修正表单错误', 'err');
      return;
    }
    const elig = calcEligibility(f);
    const isNow = f.sendingTimeType === '立即';
    const task = {
      id: nextId('sm'),
      platform: 'messenger',
      businessAccount: f.businessAccount,
      facebookPage: f.facebookPage,
      subscriptionType: f.subscriptionType,
      taskName: tn,
      targetUsers: elig.target,
      subscribedUsers: elig.subscribed,
      sendingTimeType: f.sendingTimeType,
      sendingTime: isNow ? toDisplayDt(new Date()) : toDisplayDt(f.scheduledAt),
      status: isNow ? '发送中' : '待发送',
      messageTitle: f.messageTitle.trim(),
      messageContent: f.messageContent.trim(),
      image: f.image,
      button: f.button,
      protosTags: f.protosTags,
      uploadFileName: f.uploadFileName,
      failReason: ''
    };
    store.subscriptionMessages.unshift(task);
    saveStore();
    if (isNow) {
      toast('任务已进入发送中', 'ok');
      simulateSend(task.id);
    } else {
      toast('定时任务已创建，状态为待发送', 'ok');
    }
    state.createForm = emptyCreateForm();
    closeModal();
    renderPage();
  }
  function simulateSend(id, fromRetry) {
    setTimeout(() => {
      const t = store.subscriptionMessages.find(x => x.id === id);
      if (!t || t.status !== '发送中') return;
      const fail = Math.random() < 0.22;
      if (fail) {
        t.status = '失败';
        t.failReason = fromRetry ? '重试后供应商仍返回失败' : 'mock 供应商返回失败或校验失败';
        saveStore();
        toast('任务发送失败：' + t.failReason, 'err');
      } else {
        t.status = '成功';
        t.failReason = '';
        saveStore();
        toast('发送请求已被供应商接受，等待用户完成订阅', 'ok');
      }
      if (state.route === 'sub-msg-query') renderPage();
    }, 1100);
  }

    if (!f.businessAccount) errors.businessAccount = '请选择 Business Account';
    if (!f.pageId) errors.pageId = '请选择 Facebook Page';
    if (!f.adAccountId) errors.adAccountId = '请选择 Ad Account';
    if (f.pageId && f.adAccountId && !pageMatchesAd(f.pageId, f.adAccountId)) errors.adAccountId = 'Page 与 Ad Account 必须匹配';
    if (f.budgetType === '每日预算') {
      const n = Number(f.dailyBudget);
      if (!(n > 0)) errors.dailyBudget = '选择每日预算时 Daily Budget 必填且必须大于 0';
    } else {
      const n = Number(f.lifetimeBudget);
      if (!(n > 0)) errors.lifetimeBudget = '选择生命周期预算时 Lifetime Budget 必填且必须大于 0';
    }
    m.errors = errors;
    if (Object.keys(errors).length) { renderModal(); return; }
    const now = toDisplayDt(new Date());
    const cid = String(120300000000 + Math.floor(Math.random() * 899999999));

      adAccountId: f.adAccountId,

        { value: '失败', label: '失败 / Failed' }
      ], f.status) +
      filterRange('Sending Time', 'timeFrom', 'timeTo', f.timeFrom, f.timeTo) +
      filterSearchActions() +
      '</div>';
    if (state.loading) { el.innerHTML = html + loadingHtml(); return; }
    let rows = store.bizMessages.filter(b => {
      if (f.platform && b.platform !== f.platform) return false;
      if (f.businessAccount && b.businessAccount !== f.businessAccount) return false;
      if (f.campaign && b.campaign !== f.campaign) return false;
      if (f.messageType && b.messageType !== f.messageType) return false;
      if (f.status && b.status !== f.status) return false;
      if (!inRange(b.sendingTime, f.timeFrom, f.timeTo)) return false;
      return true;
    });
    rows = sortRows(rows, ts.sortKey || 'sendingTime', ts.sortDir);
    const pg = paginate(rows, ts.page);
    ts.page = pg.page;
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      th('Campaign', 'campaign', ts) +
      th('Platform', 'platform', ts) +
      th('Business Account', 'businessAccount', ts) +
      th('Task Name', 'taskName', ts) +
      th('Message Type', 'messageType', ts) +
      th('Target Users', 'targetUsers', ts) +
      th('Sending Time', 'sendingTime', ts) +
      th('Status', 'status', ts) +
      '</tr></thead><tbody>';
    if (!pg.rows.length) html += '<tr><td colspan="8">' + emptyHtml('暂无 Biz 消息任务') + '</td></tr>';
    pg.rows.forEach(b => {
      html += '<tr><td>' + esc(b.campaign || '-') + '</td><td>' + esc(platformLabel(b.platform)) + '</td>' +
        '<td>' + esc(b.businessAccount) + '</td><td>' + esc(b.taskName) + '</td>' +
        '<td>' + esc(b.messageType) + '</td><td>' + b.targetUsers + '</td>' +
        '<td>' + esc(b.sendingTime) + '</td><td>' + statusTag(b.status) + '</td></tr>';
    });
    html += '</tbody></table></div>' + pager(pg);
    el.innerHTML = html;
  }
  function exportBiz() {
    const f = readFilters('biz-query');
    const rows = store.bizMessages.filter(b => {
      if (f.platform && b.platform !== f.platform) return false;
      if (f.businessAccount && b.businessAccount !== f.businessAccount) return false;
      if (f.campaign && b.campaign !== f.campaign) return false;
      if (f.messageType && b.messageType !== f.messageType) return false;
      if (f.status && b.status !== f.status) return false;
      if (!inRange(b.sendingTime, f.timeFrom, f.timeTo)) return false;
      return true;
    });
    downloadCSV('biz-message-export.csv',
      ['Campaign', 'Platform', 'Business Account', 'Task Name', 'Message Type', 'Target Users', 'Sending Time', 'Status'],
      rows.map(b => [b.campaign, b.platform, b.businessAccount, b.taskName, b.messageType, b.targetUsers, b.sendingTime, b.status])
    );
    toast('已导出 CSV（共 ' + rows.length + ' 条）', 'ok');
  }

  /* ========== Modal renderer ========== */
  function closeModal() {
    state.modal = null;
    state.testing = false;
    document.getElementById('modal-root').innerHTML = '';
    renderPage();
  }
  function renderModal() {
    const root = document.getElementById('modal-root');
    const m = state.modal;
    if (!m) { root.innerHTML = ''; return; }
    let title = '', body = '', ft = '', wide = false, xl = false;
    if (m.type === 'account') {
      title = m.id ? '编辑 Messenger Business Account' : '新增 Messenger Business Account';
      body = accountModalBody();
      ft = '<button class="btn" data-act="test-conn"' + (state.testing ? ' disabled' : '') + '>' + (state.testing ? '测试中…' : 'Test Connection') + '</button>' +
        '<button class="btn" data-act="modal-cancel">取消</button>' +
        '<button class="btn primary" data-act="modal-ok">Confirm</button>';
    } else if (m.type === 'subtype-mgr') {
      wide = true;
      title = '订阅类型管理';
      body = subtypeListHtml();
      ft = '<button class="btn" data-act="modal-cancel">关闭</button>';
    } else if (m.type === 'sub-group') {
      title = '新建订阅组';
      body = subGroupModalBody();
      ft = '<button class="btn" data-act="modal-cancel">取消</button><button class="btn primary" data-act="modal-ok">Confirm</button>';
    } else if (m.type === 'create-sm') {
      title = '新建订阅消息';
      xl = true;
      body = createFormHtml();
      ft = '<button class="btn" data-act="modal-cancel">取消</button><button class="btn primary" data-act="submit-create">提交发送</button>';
    } else if (m.type === 'sub-detail') {
      const user = m.user;
      const types = m.types || [user];
      const lastLogin = types.reduce(function (max, t) {
        return (t.lastLoginTime || '') > max ? t.lastLoginTime : max;
      }, user.lastLoginTime || '');
      title = '订阅详情';
      wide = true;
      body = '<dl class="detail-dl">' +
        kv('平台 / Platform', user.platform) +
        kv('商业账户 / Business Account', user.businessAccount) +
        kv('用户 / Login Name', user.loginName) +
        kv('IM用户ID / IM UserId', user.imUserId) +
        kv('最新登录时间 / Last login time', lastLogin) +
        '</dl>' +
        '<div class="field-hint" style="margin:14px 0 8px;">同一用户可订阅多个类型。当前共 ' + types.length + ' 条订阅记录。</div>' +
        '<div class="sub-type-list">' + types.map(function (s) {
          return '<div class="sub-type-card">' +
            '<div class="sub-type-hd"><span>' + esc(s.subscriptionType) + '</span>' + statusTag(s.subscriptionStatus) + '</div>' +
            '<dl class="detail-dl">' +
            kv('Facebook Page / Facebook Page', s.facebookPage || '-') +
            kv('订阅类型 / Subscription Type', s.subscriptionType) +
            kv('订阅状态 / Subscription Status', null, statusTag(s.subscriptionStatus)) +
            kv('最新订阅时间 / Latest subscription time', s.latestSubscriptionTime) +
            kv('Next Eligible Datetime', s.nextEligibleDatetime || '-') +
            '</dl></div>';
        }).join('') + '</div>';
      ft = '<button class="btn" data-act="modal-cancel">关闭</button>';
    } else if (m.type === 'campaign') {
      title = '新增 Campaign';
      body = campaignModalBody();
      ft = '<button class="btn" data-act="modal-cancel">取消</button><button class="btn primary" data-act="modal-ok">Confirm</button>';
    } else if (m.type === 'cp-view') {
      const c = m.data;
      title = 'Campaign 详情';
      wide = true;
      body = '<dl class="detail-dl">' +
        kv('Campaign Name', c.campaignName) +
        kv('Campaign ID', c.campaignId) +
        kv('Business Account', c.businessAccount) +
        kv('Page Id', c.pageId) +
        kv('Facebook Page', pageName(c.pageId)) +
        kv('AD Account Id', c.adAccountId) +
        kv('Ad Account', adName(c.adAccountId)) +
        kv('Budget Type', c.budgetType) +
        kv('Daily Budget', c.dailyBudget ? c.dailyBudget + ' cents' : '-') +
        kv('Lifetime Budget', c.lifetimeBudget ? c.lifetimeBudget + ' cents' : '-') +
        kv('Status', null, statusTag(c.status)) +
        kv('Created At', c.createdAt) +
        kv('Updated At', c.updatedAt) +
        '</dl>';
      ft = '<button class="btn" data-act="modal-cancel">关闭</button>';
    } else if (m.type === 'confirm') {
      title = m.title;
      body = '<p style="margin:0;line-height:1.6;">' + esc(m.message) + '</p>';
      ft = '<button class="btn" data-act="modal-cancel">取消</button>' +
        '<button class="btn ' + (m.danger ? 'danger' : 'primary') + '" data-act="modal-ok">' + esc(m.okText || 'Confirm') + '</button>';
    }
    root.innerHTML = '<div class="mask" id="mask"><div class="modal' + (xl ? ' xl' : wide ? ' lg' : '') + '" role="dialog" aria-modal="true">' +
      '<div class="modal-hd"><span>' + esc(title) + '</span><span class="x" data-act="modal-cancel">✕</span></div>' +
      '<div class="modal-bd">' + body + '</div>' +
      '<div class="modal-ft">' + ft + '</div></div></div>';
  }
  function kv(k, v, html) {
    return '<dt>' + esc(k) + '</dt><dd>' + (html || esc(v)) + '</dd>';
  }

  function readSubTypeDraft(e) {
    const m = state.modal;
    if (!m || !m.draft) return;
    const key = e.target.getAttribute('data-draft-field');
    m.draft[key] = e.target.value;
    delete m.errors[key];
    if (key === 'businessAccount') {
      const pages = pagesOfAccount(m.draft.businessAccount);
      m.draft.facebookPage = pages[0] ? pages[0].name : '';
      renderModal();
    }
  }

  function readModalFields(e) {
    const m = state.modal;
    if (!m || !m.form) return;
    const el = e.target;
    const key = el.getAttribute('data-modal-field');
    if (!key) return;
    if (key === 'facebookPageIds') {
      m.form.facebookPageIds = Array.from(document.querySelectorAll('[data-modal-field="facebookPageIds"]:checked')).map(x => x.value);
      renderModal();
      return;
    }
    if (m.type === 'sub-group' && key === 'upload') {
      const file = el.files && el.files[0];
      if (file) {
        m.form.uploadFileName = file.name;
        m.form.uploadCount = 200 + Math.floor(Math.random() * 1800);
        m.form.protosTags = '';
        delete m.errors.target;
        toast('已模拟解析上传文件，目标用户 ' + m.form.uploadCount + ' 人', 'ok');
      }
      renderModal();
      return;
    }
    if (m.type === 'sub-group' && key === 'protosTags') {
      m.form.protosTags = el.value;
      if (m.form.protosTags) { m.form.uploadFileName = ''; m.form.uploadCount = 0; delete m.errors.target; }
      renderModal();
      return;
    }
    m.form[key] = el.value;
    if (key === 'platform' || key === 'businessAccount' || key === 'pageId' || key === 'budgetType' || key === 'adAccountId') {
      if (m.type === 'sub-group') {
        if (key === 'platform') {
          const first = store.accounts.find(a => a.platform === m.form.platform);
          const viberBa = (store.viberAccounts || [])[0];
          m.form.businessAccount = m.form.platform === 'messenger'
            ? (first ? first.businessAccount : '')
            : (viberBa || '');
        }
        const pages = pagesOfAccount(m.form.businessAccount);
        m.form.facebookPage = m.form.platform === 'messenger' && pages[0] ? pages[0].name : '';
      }
      if (key === 'businessAccount' && m.type === 'campaign') {
        const pages = pagesOfAccount(m.form.businessAccount);
        m.form.pageId = pages[0] ? pages[0].id : '';
        const acc = store.accounts.find(a => a.businessAccount === m.form.businessAccount);
        const ads = adsForPages(m.form.pageId ? [m.form.pageId] : []);
        m.form.adAccountId = (acc && ads.some(a => a.id === acc.adAccountId)) ? acc.adAccountId : (ads[0] ? ads[0].id : '');
      }
      renderModal();
    }
  }

  function onModalOk() {
    const m = state.modal;
    if (!m) return;
    if (m.type === 'account') saveAccount();
    else if (m.type === 'create-sm') submitCreate();
    else if (m.type === 'sub-group') saveSubGroup();
    else if (m.type === 'campaign') saveCampaign();
    else if (m.type === 'confirm' && typeof m.onOk === 'function') {
      const fn = m.onOk;
      closeModal();
      fn();
    } else closeModal();
  }

  function openConfirm(opts) {
    state.modal = {
      type: 'confirm',
      title: opts.title,
      message: opts.message,
      okText: opts.okText,
      danger: !!opts.danger,
      onOk: opts.onOk
    };
    renderModal();
  }

  /* ========== Events ========== */
  document.addEventListener('click', function (e) {
    const t = e.target.closest('[data-act]');
    if (!t) {
      if (e.target.id === 'mask') closeModal();
      return;
    }
    const act = t.getAttribute('data-act');
    const id = t.getAttribute('data-id');
    if (act === 'nav') navigate(t.getAttribute('data-route'));
    else if (act === 'toggle-side') document.getElementById('sidebar').classList.toggle('open');
    else if (act === 'sub-tab') {
      const tab = t.getAttribute('data-tab');
      if (tab === state.subTab) return;
      state.subTab = tab;
      renderPage();
    } else if (act === 'search') {
      readFilters(pageDataKey());
      tableState(pageDataKey()).page = 1;
      withLoading();
    } else if (act === 'reset') {
      const key = pageDataKey();
      if (key === 'subscription') state.filters.subscription = defaultSubFilters();
      else if (key === 'subscription-group') state.filters['subscription-group'] = defaultSubGroupFilters();
      else state.filters[key] = {};
      tableState(key).page = 1;
      withLoading();
    } else if (act === 'add') {
      if (state.route === 'account') openAccountModal(null);
      else if (state.route === 'campaign') openCampaignModal();
    } else if (act === 'open-subtype-mgr') openSubTypeMgr();
    else if (act === 'subtype-add') startSubTypeDraft();
    else if (act === 'subtype-save') saveSubType();
    else if (act === 'subtype-cancel') {
      state.modal.draft = null;
      state.modal.errors = {};
      renderModal();
    } else if (act === 'open-create-group') openCreateGroupModal();
    else if (act === 'open-create-sm') openCreateSmModal(); else if (act === 'edit') openAccountModal(id);
    else if (act === 'detail') openSubDetail(id);
    else if (act === 'export') {
      if (state.route === 'subscription') exportSubscriptions();
      else if (state.route === 'biz-query') exportBiz();
    } else if (act === 'sort') {
      if (t.classList.contains('no-sort')) return;
      const tableKey = (state.modal && state.modal.type === 'subtype-mgr') ? 'subscription-type' : pageDataKey();
      const ts = tableState(tableKey);
      const key = t.getAttribute('data-key');
      if (ts.sortKey === key) ts.sortDir = ts.sortDir === 'asc' ? 'desc' : 'asc';
      else { ts.sortKey = key; ts.sortDir = 'asc'; }
      if (state.modal && state.modal.type === 'subtype-mgr') renderModal();
      else renderPage();
    } else if (act === 'page') {
      const tableKey = (state.modal && state.modal.type === 'subtype-mgr') ? 'subscription-type' : pageDataKey();
      tableState(tableKey).page = Number(t.getAttribute('data-page'));
      if (state.modal && state.modal.type === 'subtype-mgr') renderModal();
      else renderPage();
    } else if (act === 'modal-cancel') closeModal();
    else if (act === 'modal-ok') onModalOk();
    else if (act === 'test-conn') testConnection();
    else if (act === 'toggle-type') {
      const rec = store.subscriptionTypes.find(x => x.id === id);
      if (!rec) return;
      rec.status = rec.status === '开启' ? '关闭' : '开启';
      saveStore();
      toast('状态已切换为' + rec.status, 'ok');
      if (state.modal && state.modal.type === 'subtype-mgr') renderModal();
      else renderPage();
    } else if (act === 'submit-create') submitCreate();
    else if (act === 'cancel-sm') {
      openConfirm({
        title: '取消任务',
        message: '仅待发送任务可取消。取消后该任务将从列表移除。',
        okText: 'Cancel Task',
        danger: true,
        onOk: function () {
          const idx = store.subscriptionMessages.findIndex(x => x.id === id && x.status === '待发送');
          if (idx < 0) { toast('只能取消待发送任务', 'err'); return; }
          store.subscriptionMessages.splice(idx, 1);
          saveStore();
          toast('任务已取消', 'ok');
          renderPage();
        }
      });
    } else if (act === 'retry-sm') {
      const rec = store.subscriptionMessages.find(x => x.id === id);
      if (!rec || rec.status !== '失败') { toast('仅失败任务可重试', 'err'); return; }
      rec.status = '发送中';
      rec.failReason = '';
      saveStore();
      toast('已重新提交，状态为发送中', 'ok');
      renderPage();
      simulateSend(id, true);
    } else if (act === 'view-cp') {
      const c = store.campaigns.find(x => x.id === id);
      if (!c) return;
      state.modal = { type: 'cp-view', data: c };
      renderModal();
    } else if (act === 'close-cp') {
      openConfirm({
        title: '关闭 Campaign',
        message: '关闭后 Status 将变为「关闭」。',
        okText: 'Close',
        onOk: function () {
          const c = store.campaigns.find(x => x.id === id);
          if (!c) return;
          c.status = '关闭';
          c.updatedAt = toDisplayDt(new Date());
          saveStore();
          toast('Campaign 已关闭', 'ok');
          renderPage();
        }
      });
    } else if (act === 'del-cp') {
      openConfirm({
        title: '删除 Campaign',
        message: '删除后 Status 将变为「已删除」，记录保留便于追溯。',
        okText: 'Delete',
        danger: true,
        onOk: function () {
          const c = store.campaigns.find(x => x.id === id);
          if (!c) return;
          c.status = '已删除';
          c.updatedAt = toDisplayDt(new Date());
          saveStore();
          toast('Campaign 已删除', 'ok');
          renderPage();
        }
      });
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.getAttribute('data-draft-field')) {
      readSubTypeDraft(e);
      return;
    }
    if (e.target.getAttribute('data-modal-field')) {
      readModalFields(e);
      return;
    }
    const field = e.target.getAttribute('data-field');
    if (!field) return;
    const f = state.createForm;
    if (field === 'upload') {
      const file = e.target.files && e.target.files[0];
      if (file) {
        f.uploadFileName = file.name;
        f.uploadCount = 200 + Math.floor(Math.random() * 1800);
        f.protosTags = '';
        toast('已模拟解析上传文件，目标用户 ' + f.uploadCount + ' 人', 'ok');
      }
      refreshCreateUi();
      return;
    }
    if (field === 'image') {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () {
        f.image = reader.result;
        refreshCreateUi();
      };
      reader.readAsDataURL(file);
      return;
    }
    if (field === 'protosTags') {
      f.protosTags = e.target.value;
      if (f.protosTags) { f.uploadFileName = ''; f.uploadCount = 0; }
      refreshCreateUi();
      return;
    }
    if (field === 'businessAccount') {
      f.businessAccount = e.target.value;
      const pages = pagesOfAccount(f.businessAccount);
      f.facebookPage = pages[0] ? pages[0].name : '';
      const types = openTypes(f.businessAccount);
      f.subscriptionType = types[0] ? types[0].subscriptionType : '';
      refreshCreateUi();
      return;
    }
    f[field] = e.target.value;
    if (field === 'sendingTimeType' || field === 'button' || field === 'facebookPage' || field === 'subscriptionType') refreshCreateUi();
  });

  document.addEventListener('input', function (e) {
    const modalKey = e.target.getAttribute('data-modal-field');
    if (modalKey && state.modal && state.modal.form && modalKey !== 'facebookPageIds') {
      state.modal.form[modalKey] = e.target.value;
      return;
    }
    const field = e.target.getAttribute('data-field');
    if (!field) return;
    if (field === 'upload' || field === 'image') return;
    state.createForm[field] = e.target.value;
    if (field === 'messageTitle' || field === 'messageContent') {
      const titleEl = document.querySelector('.msgr-title');
      const bodyEl = document.querySelector('.msgr-body');
      if (titleEl) titleEl.textContent = state.createForm.messageTitle || '消息标题';
      if (bodyEl) bodyEl.textContent = state.createForm.messageContent || '消息内容将显示在这里';
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.modal) closeModal();
  });

  window.addEventListener('hashchange', function () {
    const h = location.hash.replace(/^#/, '');
    if (h && ROUTES[h] && h !== state.route) navigate(h);
  });

  const initHash = location.hash.replace(/^#/, '');
  state.route = ROUTES[initHash] ? initHash : 'account';
  renderAll();
})();
</script>
</body>
</html>
